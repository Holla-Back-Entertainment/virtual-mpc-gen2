# Lab only. The stock unit writes the trusted dm-verity root digests to
# /sys/kernel/security/loadpin/dm-verity, so that the device kernel's LoadPin LSM loads
# modules and firmware only from the verified rootfs. The lab kernel is built without
# LoadPin (no such file), so the unit failed on every boot. Nothing depends on it, and the
# lab kernel restricts nothing that it would have configured: skip it when the file is
# missing instead of failing; it runs unchanged on a kernel that has LoadPin.
[Unit]
ConditionPathExists=/sys/kernel/security/loadpin/dm-verity

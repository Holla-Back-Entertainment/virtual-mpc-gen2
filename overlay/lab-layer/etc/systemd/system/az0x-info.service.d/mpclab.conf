# Lab only. az0x-info only logs hardware/software facts to the journal (nothing reads its
# result). It stops at the first missing hardware fact, the board revision
# inmusic,az04-pcb-rev that U-Boot adds to the device tree on the device ("failed to collect
# info: No data available"); the lab boots without U-Boot and its virtio eMMC has no
# mmcblk0 sysfs data either. Skip it instead of failing; it runs if that property is ever set.
[Unit]
ConditionPathExists=/sys/firmware/devicetree/base/inmusic,az04-pcb-rev

# Lab only. Sorted before 10-az0x.conf (and before Developer Mode's 00-user.conf), so these
# first values win. Only what the lab needs: its own host key, and its key in authorized_keys
# also after Developer Mode points AuthorizedKeysFile at /data/ssh/authorized_keys (the stock
# file is still read). No PermitRootLogin here: stock 10-az0x.conf already says
# prohibit-password, and setting it here masked Developer Mode's "PermitRootLogin yes".
HostKey /etc/ssh/mpclab_host_ed25519_key
HostKeyAlgorithms ssh-ed25519
AuthorizedKeysFile /root/.ssh/authorized_keys /data/ssh/authorized_keys
